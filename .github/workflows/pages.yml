name: Publish usage guide

on:
  push:
    branches: [main]
    paths: ['site/**', 'sdk/entree-print.mjs', 'sdk/outbox.mjs', 'sdk/events.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify examples and assets
        run: node site/verify.mjs
      - name: Stage the public site
        run: node site/stage.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
